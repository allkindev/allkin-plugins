      </span>
    </td>
    <td class="data-row-size"></td>
    <td class="data-row-created"></td>
    <td class="data-row-modified"></td>
    <td class="data-row-actions">
      <button type="button" class="data-row-act data-row-download" title="Download" data-i18n-title="common.download" aria-label="Download" data-i18n-aria-label="common.download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      </button>
      <button type="button" class="data-row-act data-row-delete" title="Delete" data-i18n-title="common.delete" aria-label="Delete" data-i18n-aria-label="common.delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12"/><path d="M9 7V4h6v3"/></svg>
      </button>
      <button type="button" class="data-row-act data-row-more" title="More actions" data-i18n-title="plugin.file-explorer.row.more" aria-label="More actions" data-i18n-aria-label="plugin.file-explorer.row.more" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>
      </button>
    </td>
  </tr>
</template>
<!-- Exécution d'un script, en deux temps : d'abord le contenu, ensuite la
     sortie en direct. -->
<template id="script-run-template">
  <div class="modal-backdrop script-run-backdrop">
    <div class="modal modal-wide script-run-modal" role="dialog" aria-modal="true" aria-labelledby="script-run-title">
      <header class="script-run-head">
        <span class="script-run-icon">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg>
        </span>
        <span class="script-run-head-text">
          <span class="script-run-name" id="script-run-name"></span>
          <span class="script-run-meta dim" id="script-run-meta"></span>
        </span>
        <span class="script-run-state" id="script-run-state"></span>
      </header>
      <div class="script-run-phase" id="script-run-confirm">
        <pre class="script-run-source"><code id="script-run-source"></code></pre>
        <p class="script-run-warn dim" id="script-run-warn"></p>
      </div>
      <div class="script-run-phase hidden" id="script-run-live">
        <pre class="script-run-console" id="script-run-console" role="log" aria-live="polite"></pre>
      </div>
      <div class="modal-actions script-run-actions">
        <button type="button" class="modal-cancel" id="script-run-cancel" data-i18n="common.cancel">Cancel</button>
        <button type="button" id="script-run-go" data-i18n="plugin.file-explorer.run.action">Run</button>
        <button type="button" class="danger hidden" id="script-run-stop" data-i18n="plugin.file-explorer.run.stop">Stop</button>
      </div>
    </div>
  </div>
</template>
<!-- Progression d'un dépôt. Le bouton n'apparaît qu'à la fin. -->
<template id="upload-progress-template">
  <div class="modal-backdrop upload-modal-backdrop">
    <div class="modal upload-modal" role="dialog" aria-modal="true" aria-labelledby="upload-modal-title">
      <h2 id="upload-modal-title" data-i18n="plugin.file-explorer.upload.title.running">Upload in progress</h2>
      <p class="dim upload-modal-target" id="upload-modal-target"></p>
      <div class="update-progress">
        <div class="update-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <span class="update-progress-fill" id="upload-progress-fill"></span>
        </div>
        <span class="update-progress-count dim" id="upload-progress-count"></span>
      </div>
      <p class="upload-modal-current dim" id="upload-modal-current"></p>
      <div class="upload-errors hidden" id="upload-errors"></div>
      <div class="modal-actions hidden" id="upload-modal-actions">
        <button type="button" class="modal-cancel" data-i18n="common.close">Close</button>
      </div>
    </div>
  </div>
</template>
</template>

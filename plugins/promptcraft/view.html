<template data-slot="views">
    <!-- PromptCraft : l'atelier de fabrication d'agents. Un onglet global
         (agentId null), trois volets internes. Tout le contenu des formulaires
         est construit en JS depuis le schéma (schema.js) : ce fichier ne porte
         que la charpente. -->
    <div class="pc-view hidden" id="pc-view">
      <header class="pc-head">
        <div class="pc-head-title">
          <span class="pc-logo" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><path d="M5 17l.6 1.4L7 19l-1.4.6L5 21l-.6-1.4L3 19l1.4-.6z"/></svg>
          </span>
          <div class="pc-head-text">
            <h2 class="pc-title">PromptCraft</h2>
            <span class="pc-subtitle dim" id="pc-subtitle">Atelier d'agents sur mesure</span>
          </div>
        </div>
        <div class="pc-head-actions">
          <button type="button" class="secondary pc-head-btn" id="pc-new-btn" title="Repartir d'un agent vierge ou d'un archétype">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span class="pc-head-btn-label">Nouveau</span>
          </button>
          <button type="button" class="secondary pc-head-btn" id="pc-open-btn" title="Rouvrir un .allkin produit par PromptCraft, ou un projet .json">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            <span class="pc-head-btn-label">Ouvrir</span>
          </button>
          <input type="file" id="pc-open-input" accept=".allkin,.zip,.json" hidden />
          <button type="button" class="secondary pc-head-btn" id="pc-download-btn" title="Télécharger l'agent au format .allkin">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
            <span class="pc-head-btn-label">.allkin</span>
          </button>
          <button type="button" class="pc-head-btn" id="pc-deploy-btn" title="Créer cet agent dans ton instance Allkin">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            <span class="pc-head-btn-label">Déployer</span>
          </button>
        </div>
      </header>

      <nav class="pc-tabs" role="tablist" aria-label="Volets de PromptCraft">
        <button type="button" class="pc-tab" role="tab" data-pc-tab="settings" aria-selected="true">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          Paramètres
        </button>
        <button type="button" class="pc-tab" role="tab" data-pc-tab="prompt" aria-selected="false">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
          Prompt
          <span class="pc-score-chip" id="pc-score-chip" title="Score de qualité du prompt">—</span>
        </button>
        <button type="button" class="pc-tab" role="tab" data-pc-tab="test" aria-selected="false">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-8 8H7l-4 3V12a8 8 0 018-8h2a8 8 0 018 8z"/></svg>
          Conversation test
        </button>
      </nav>

      <!-- ---- Volet 1 : Paramètres ---- -->
      <section class="pc-pane" id="pc-pane-settings" role="tabpanel">
        <aside class="pc-nav" id="pc-nav" aria-label="Sections"></aside>
        <div class="pc-form" id="pc-form"></div>
      </section>

      <!-- ---- Volet 2 : Prompt ---- -->
      <section class="pc-pane pc-pane-prompt hidden" id="pc-pane-prompt" role="tabpanel">
        <div class="pc-prompt-main">
          <div class="pc-prompt-toolbar">
            <div class="pc-seg" role="group" aria-label="Affichage">
              <button type="button" class="pc-seg-btn is-on" data-pc-prompt-mode="source">Source</button>
              <button type="button" class="pc-seg-btn" data-pc-prompt-mode="preview">Aperçu</button>
            </div>
            <span class="pc-prompt-stats dim" id="pc-prompt-stats"></span>
            <span class="pc-prompt-manual hidden" id="pc-prompt-manual" title="Le prompt ne suit plus les réglages">retouché à la main</span>
            <span class="pc-grow"></span>
            <button type="button" class="ghost pc-icon-btn hidden" id="pc-prompt-reset" title="Revenir au prompt généré par les réglages">
              <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button type="button" class="ghost pc-icon-btn" id="pc-prompt-copy" title="Copier le prompt">
              <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
            </button>
          </div>
          <textarea class="pc-prompt-source" id="pc-prompt-source" spellcheck="false" aria-label="Prompt de l'agent (CLAUDE.md)"></textarea>
          <div class="pc-prompt-preview md-body hidden" id="pc-prompt-preview"></div>
          <!-- Affinage par le modèle : le prompt compilé est déterministe ;
               cette zone demande une retouche ciblée, relue avant d'être prise. -->
          <form class="pc-refine" id="pc-refine">
            <input type="text" id="pc-refine-input" placeholder="Affiner avec l'IA — ex. « ajoute une section sur la gestion des réclamations »" autocomplete="off" />
            <button type="submit" class="secondary" id="pc-refine-btn">Affiner</button>
          </form>
          <p class="error hidden" id="pc-refine-error"></p>
        </div>
        <aside class="pc-quality" id="pc-quality" aria-label="Qualité du prompt"></aside>
      </section>

      <!-- ---- Volet 3 : Conversation test ---- -->
      <section class="pc-pane pc-pane-test hidden" id="pc-pane-test" role="tabpanel">
        <div class="pc-test-bar">
          <span class="pc-test-status" id="pc-test-status">
            <span class="pc-dot" id="pc-test-dot"></span>
            <span id="pc-test-status-text">Banc d'essai prêt</span>
          </span>
          <span class="pc-test-stale hidden" id="pc-test-stale">Le prompt a changé depuis le début de cette conversation.</span>
          <span class="pc-grow"></span>
          <button type="button" class="secondary pc-test-btn" id="pc-test-restart" title="Nouvelle conversation, avec le prompt actuel">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Nouvelle conversation
          </button>
          <button type="button" class="ghost pc-icon-btn" id="pc-test-remove" title="Supprimer l'agent du banc d'essai (vers la corbeille)">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3m-7 0v13a1 1 0 001 1h6a1 1 0 001-1V7"/></svg>
          </button>
        </div>
        <div class="pc-test-log" id="pc-test-log" role="log" aria-live="polite"></div>
        <div class="pc-test-probes" id="pc-test-probes"></div>
        <form class="pc-test-compose" id="pc-test-compose">
          <textarea id="pc-test-input" rows="2" placeholder="Écris à ton agent…" aria-label="Message de test"></textarea>
          <button type="submit" id="pc-test-send" title="Envoyer (Entrée)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <button type="button" class="danger hidden" id="pc-test-stop" title="Interrompre">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </form>
        <p class="pc-test-note dim">Le banc d'essai est un vrai agent Allkin, <strong>sans aucun droit</strong> : il éprouve la personnalité, le savoir-faire et les consignes, pas les outils. Chaque « Nouvelle conversation » relit le prompt actuel.</p>
      </section>
    </div>
</template>

<template data-slot="body">
<!-- Choix d'un point de départ : vierge ou archétype. -->
<template id="pc-new-template">
  <div class="modal-backdrop">
    <div class="modal modal-wide pc-modal" role="dialog" aria-modal="true" aria-labelledby="pc-new-title">
      <h2 id="pc-new-title">Nouvel agent</h2>
      <p class="dim">Pars d'un archétype : il règle d'un coup personnalité, compétences et méthode. Tout reste modifiable ensuite. Le projet en cours sera remplacé.</p>
      <div class="pc-archetypes" id="pc-archetypes"></div>
      <div class="modal-actions">
        <button type="button" class="ghost modal-cancel">Annuler</button>
      </div>
    </div>
  </div>
</template>

<!-- Déploiement : récapitulatif des droits avant de créer l'agent. -->
<template id="pc-deploy-template">
  <div class="modal-backdrop">
    <div class="modal pc-modal" role="dialog" aria-modal="true" aria-labelledby="pc-deploy-title">
      <h2 id="pc-deploy-title">Déployer dans Allkin</h2>
      <p class="dim" id="pc-deploy-summary"></p>
      <ul class="pc-deploy-rights" id="pc-deploy-rights"></ul>
      <p class="error hidden" id="pc-deploy-error"></p>
      <div class="modal-actions">
        <button type="button" class="ghost modal-cancel">Annuler</button>
        <button type="button" id="pc-deploy-go">Créer l'agent</button>
      </div>
    </div>
  </div>
</template>
</template>

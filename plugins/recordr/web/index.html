<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recordr</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- One sprite for every icon: 24×24 line drawings, like Allkin's own. -->
<svg class="lt-sprite" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14"/><path d="M15 5v14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.6a3.5 3.5 0 010 6.8"/><path d="M18 14.3a6.5 6.5 0 013.5 5.7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></symbol>
</svg>

<div class="lt-app" id="app">
  <aside class="lt-panel lt-history-panel" id="history-panel">
    <header class="lt-panel-head">
      <h2 class="lt-panel-title" data-i18n="history.title"></h2>
      <button type="button" class="lt-icon-btn lt-panel-close" data-close="history" data-i18n-aria-label="action.close"><svg><use href="#i-close"/></svg></button>
    </header>
    <label class="lt-search">
      <svg><use href="#i-search"/></svg>
      <input type="search" id="history-search" autocomplete="off" data-i18n-placeholder="history.search" data-i18n-aria-label="history.search">
    </label>
    <ul class="lt-history" id="history"></ul>
    <p class="lt-panel-empty hidden" id="history-empty"></p>
  </aside>

  <main class="lt-main">
    <header class="lt-top">
      <div class="lt-top-row">
        <button type="button" class="lt-icon-btn lt-only-narrow" id="history-toggle" data-i18n-aria-label="history.title" data-i18n-title="history.title"><svg><use href="#i-history"/></svg></button>
        <div class="lt-heading">
          <input type="text" class="lt-title" id="title" maxlength="200" autocomplete="off" data-i18n-placeholder="title.placeholder" data-i18n-aria-label="title.label">
          <p class="lt-meta" id="meta"></p>
        </div>
        <button type="button" class="lt-icon-btn lt-only-narrow" id="speakers-toggle" data-i18n-aria-label="speakers.title" data-i18n-title="speakers.title"><svg><use href="#i-people"/></svg></button>
      </div>
      <div class="lt-controls">
        <div class="lt-chip hidden" id="chip" role="status">
          <span class="lt-chip-dot"></span>
          <span id="chip-text"></span>
          <span class="lt-meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <button type="button" class="lt-btn hidden" id="pause"><svg><use href="#i-pause"/></svg><span></span></button>
        <button type="button" class="lt-btn lt-primary" id="record"><svg><use href="#i-mic"/></svg><span></span></button>
      </div>
    </header>

    <p class="lt-notice hidden" id="notice" role="alert"></p>

    <div class="lt-stage">
      <section class="lt-transcript" id="transcript" aria-live="polite"></section>
      <div class="lt-empty" id="empty">
        <span class="lt-empty-icon"><svg><use href="#i-mic"/></svg></span>
        <h2 data-i18n="empty.title"></h2>
        <ul>
          <li data-i18n="empty.live"></li>
          <li data-i18n="empty.rename"></li>
          <li data-i18n="empty.background"></li>
        </ul>
      </div>
      <button type="button" class="lt-btn lt-latest hidden" id="latest"><svg><use href="#i-down"/></svg><span data-i18n="action.latest"></span></button>
    </div>

    <footer class="lt-foot">
      <button type="button" class="lt-btn" id="copy"><svg><use href="#i-copy"/></svg><span data-i18n="action.copy"></span></button>
      <button type="button" class="lt-btn" id="download"><svg><use href="#i-download"/></svg><span data-i18n="action.download"></span></button>
      <button type="button" class="lt-btn" id="new"><svg><use href="#i-plus"/></svg><span data-i18n="action.new"></span></button>
      <span class="lt-saved" id="saved"></span>
    </footer>
  </main>

  <aside class="lt-panel lt-speakers-panel" id="speakers-panel">
    <header class="lt-panel-head">
      <h2 class="lt-panel-title" data-i18n="speakers.title"></h2>
      <button type="button" class="lt-icon-btn lt-panel-close" data-close="speakers" data-i18n-aria-label="action.close"><svg><use href="#i-close"/></svg></button>
    </header>
    <ul class="lt-speakers" id="speakers"></ul>
    <p class="lt-panel-empty" id="speakers-empty" data-i18n="speakers.empty"></p>
  </aside>
</div>
<div class="lt-toast" id="toast" role="status" aria-live="polite"></div>
<script src="locales.js"></script>
<script src="app.js"></script>
</body>
</html>
